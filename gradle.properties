# The project path contains Cyrillic characters. Gradle passes the test worker classpath via an argument file,
# and on Windows the Java launcher reads that file in the system code page (Cp1251). Running the Gradle daemon
# with the same encoding keeps the paths intact; Java sources are still compiled as UTF-8 (see build.gradle).
org.gradle.jvmargs=-Xmx512m -XX:MaxMetaspaceSize=384m -Dfile.encoding=windows-1251
